<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica MedCocal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Clínica MedCocal</h1>
        <nav>
            <a href="index.html">Pacientes</a>
            <a href="medicos.html">Médicos</a>
            <a href="servicos.html">Serviços</a>
            <a href="agendamentos.html">Agendamentos</a>
            <a href="login.html" class="active">Login</a>
        </nav>
    </header>

    <div class="login-card" style="margin: 50px auto;">
        <div class="login-header">
            <h2>Seja bem-vindo(a)</h2>
        </div>
        
        <form id="formLogin" class="login-form">
            <div class="form-group">
                <label for="loginEmail">E-mail</label>
                <input type="email" id="loginEmail" required placeholder="seu.email@exemplo.com">
            </div>

            <div class="form-group">
                <label for="loginSenha">Senha</label>
                <input type="password" id="loginSenha" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-submit">Entrar</button>

            <p class="login-footer">
                Ainda não possui uma conta? <a href="index.html">Criar conta</a>
            </p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
