<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica MedCocal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <img src="logo-medcocal.png" alt="Logotipo Clínica MedCocal" class="logo-login">
            <h2>Seja bem-vindo(a)</h2>
        </div>
        
        <form id="formLogin" class="login-form">
    <div class="form-group">
        <label for="loginEmail">E-mail ou Usuário</label>
        <input type="text" id="loginEmail" required placeholder="Digite 'teste' ou seu e-mail">
    </div>

    <div class="form-group">
        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" required placeholder="Digite sua senha">
    </div>

    <button type="submit" class="btn-submit">Entrar</button>

    <!-- Observação de Acesso de Teste -->
    <p class="dica-teste">
        💡 <strong>Acesso de teste:</strong> Usuário: <code>teste</code> | Senha: <code>123</code>
    </p>

    <p class="login-footer">
        Ainda não possui uma conta? <a href="cadastro.html">Criar conta</a>
    </p>
</form>
    </div>

    <script src="script.js"></script>
</body>
</html>
