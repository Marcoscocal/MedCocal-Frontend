<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica MedCocal - Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card" style="max-width: 480px;">
        <div class="login-header">
            <h2>Criar Conta de Funcionário</h2>
        </div>
        
        <form id="formCadastroFuncionario" class="login-form">
            <div class="form-group">
                <label for="nomeFuncionario">Nome Completo</label>
                <input type="text" id="nomeFuncionario" required placeholder="Ex: Pedro Alex">
            </div>

            <div class="form-group">
                <label for="emailFuncionario">E-mail de Acesso</label>
                <input type="email" id="emailFuncionario" required placeholder="seu.email@exemplo.com">
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label for="cpfFuncionario">CPF</label>
                    <input type="text" id="cpfFuncionario" required placeholder="000.000.000-00">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="celularFuncionario">Celular</label>
                    <input type="tel" id="celularFuncionario" required placeholder="(00) 00000-0000">
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label for="senhaFuncionario">Senha</label>
                    <input type="password" id="senhaFuncionario" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" required placeholder="Repita a senha">
                </div>
            </div>

            <button type="submit" class="btn-submit">Finalizar Cadastro</button>

            <p style="font-size: 0.75rem; color: #777; text-align: center; margin-top: 10px;">
                Ao se cadastrar, você concorda com os termos de agendamento da clínica.
            </p>

            <p class="login-footer">
                Já possui uma conta cadastrada? <a href="login.html">Fazer login</a>
            </p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
