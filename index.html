<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica MedCocal - Cadastro de Paciente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Clínica MedCocal</h1>
    <nav>
    <a href="index.html">Pacientes</a>
    <a href="medicos.html">Médicos</a>
    <a href="servicos.html">Serviços</a>
    <a href="agendamentos.html">Agendamentos</a>
    <a href="#" onclick="fazerLogout()">Sair</a>
</nav>
    </header>

    <main class="container">
        <h2>Cadastro de Paciente</h2>
        <form id="formPaciente">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required placeholder="Digite o nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required placeholder="exemplo@email.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required placeholder="Digite sua senha">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00">
            </div>

            <button type="submit" class="btn-submit">Cadastrar Paciente</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
