<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica MedCocal - Gestão de Serviços</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <a href="index.html" class="logo-link">
        <img src="logo-medcocal.png" alt="Clínica MedCocal" class="logo-img">
    </a>
    <nav>
        <a href="index.html">Pacientes</a>
        <a href="medicos.html">Médicos</a>
        <a href="servicos.html" class="active">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="#" onclick="fazerLogout()">Sair</a>
    </nav>
</header>

    <main class="container">
        <h2>Cadastro de Serviço / Exame</h2>
        <form id="formServico">
            <div class="form-group">
                <label for="nomeServico">Nome do Serviço:</label>
                <input type="text" id="nomeServico" required placeholder="Ex: Consulta Generalista, Hemograma">
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" step="0.01" id="preco" required placeholder="150.00">
            </div>

            <div class="form-group">
                <label for="duracao">Duração (em minutos):</label>
                <input type="number" id="duracao" required placeholder="30">
            </div>

            <button type="submit" class="btn-submit">Cadastrar Serviço</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
